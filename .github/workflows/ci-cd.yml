name: CI & EC2 Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Run Ruff lint checks
        run: ruff check app tests

      - name: Run pytest unit suite ($0 API cost)
        env:
          OPENAI_API_KEY: test-openai-key
          GEMINI_API_KEY: test-gemini-key
          ADMIN_API_KEY: test-admin-key
        run: pytest -v

      - name: Build production Docker image
        run: docker build -t ai-gateway:ci .

      - name: Validate production Compose config
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config -q

  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/ai-gateway
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            for i in $(seq 1 12); do
              if docker compose -f docker-compose.prod.yml exec -T gateway python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"; then
                echo "Health check passed!"
                docker image prune -f
                exit 0
              fi
              echo "Waiting for gateway to become healthy ($i/12)..."
              sleep 5
            done
            echo "Health check failed!"
            docker compose -f docker-compose.prod.yml logs --tail=50 gateway
            exit 1